name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para lançar (ex: 1.0.1)'
        required: false
        default: ''

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compilação Desktop (Windows .exe, .msi e artefatos de Auto-Update)
  # ---------------------------------------------------------------------------
  release-windows:
    name: Build Windows & Auto-Update
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Desktop (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Synapse v__VERSION__'
          releaseBody: |
            ## O que há de novo no Synapse v__VERSION__
            
            Consulte os arquivos para download abaixo:
            - **Windows**: Baixe o instalador `.exe` (NSIS) ou `.msi`. O app atualizará automaticamente nas próximas versões!
            - **Android**: Baixe o arquivo `.apk` diretamente para seu celular.
          releaseDraft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # 2. Compilação Mobile (Android APK)
  # ---------------------------------------------------------------------------
  release-android:
    name: Build Android APK
    needs: release-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          # O runner ubuntu-latest já vem com Android SDK e NDK pré-instalados
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Instalando NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"
            NDK_DIR="$ANDROID_HOME/ndk/27.1.12297006"
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK selecionado: $NDK_DIR"
          # Aceita automaticamente quaisquer licenças pendentes do SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies
        run: npm install

      - name: Initialize Android Target & Icons
        run: |
          npx tauri android init --ci --skip-targets-install
          npx tauri icon --ios-color "#161616" app-icon.png
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      - name: Build Android APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64

      - name: Sign & Prepare APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p release-apk
          UNSIGNED_APK=$(find src-tauri/gen/android -name "*universal*release*.apk" -o -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Erro: APK compilado não encontrado!"
            exit 1
          fi
          echo "APK encontrado: $UNSIGNED_APK"

          KEYSTORE_FILE="release-key.jks"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-SynapseRelease2026!}"
          KS_ALIAS="${ANDROID_KEY_ALIAS:-synapse}"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KS_PASS" \
              -dname "CN=Synapse, OU=Mobile, O=Hexz29, L=SaoPaulo, ST=SP, C=BR"
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Usando build-tools: $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" release-apk/Synapse-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out release-apk/Synapse-Android.apk \
            release-apk/Synapse-aligned.apk

          rm -f release-apk/Synapse-aligned.apk "$KEYSTORE_FILE"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose release-apk/Synapse-Android.apk
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-android-apk
          path: release-apk/*.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
